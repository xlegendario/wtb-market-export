# Render Cron Job: draait één keer per dag, doet zijn werk, en stopt.
# Geen always-on instance nodig.
#
# ZOMERTIJD
# Render's cron schedules staan in UTC. 12:30 Nederlandse tijd is 10:30 UTC in
# de zomer en 11:30 UTC in de winter. Daarom plannen we beide tijden, en laat
# `--today` alleen de run doorgaan waarbij het lokaal 12:xx is
# (WTB_RUN_LOCAL_HOUR). De andere run stopt binnen een seconde zonder iets te
# doen. Zo klopt 12:30 het hele jaar zonder dat je iets hoeft te verzetten.
services:
  - type: cron
    name: wtb-market-export
    runtime: node
    plan: starter
    schedule: '30 10,11 * * *'
    buildCommand: npm install
    startCommand: node scripts/run-profile.js --today
    envVars:
      - key: TZ
        value: Europe/Amsterdam
      - key: WTB_RUN_LOCAL_HOUR
        value: '12'
      - key: AIRTABLE_ORDERS_TABLE
        value: Unfulfilled Orders Log
      - key: WTB_API_BASE_URL
        value: https://api.wtbmarket.eu
      - key: WTB_SIZE_MODE
        value: raw
      # Welke filter op welke dag. Zonder entry voor vandaag doet de run niets.
      - key: WTB_DAILY_PROFILES
        value: default=ready
      # Leeg laten = nooit items van de WTB-lijst verwijderen.
      - key: WTB_PRUNE_PROFILES
        value: ''
      # Secrets: in het Render dashboard invullen, niet hier.
      - key: AIRTABLE_TOKEN
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false
      - key: WTB_API_KEY
        sync: false
      - key: WTB_USER_ID
        sync: false
